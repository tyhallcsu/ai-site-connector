name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.5 lands here once shivammathur/setup-php ships a stable image (issue #51).
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: PHP -l on every PHP file
        run: |
          set -e
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" || status=1
          done < <(find . -name "*.php" \
            -not -path './.git/*' \
            -not -path './vendor/*' \
            -not -path './build/*' \
            -not -path './dist/*' \
            -print0)
          exit $status

  coding-standards:
    name: Composer and PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=512M

      - name: Validate composer metadata
        run: composer validate --strict --no-interaction

      - name: Install dev dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run composer lint
        run: composer lint

      - name: Run WordPress coding standards
        run: composer phpcs

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=512M

      - name: Install dev dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # PHPUnit 9 exits 0 on "No tests executed!", which once hid a
      # mis-configured suite. Fail unless at least one test actually ran.
      - name: Run PHPUnit
        run: |
          set -o pipefail
          composer test 2>&1 | tee /tmp/phpunit.out
          grep -Eq '^OK \([1-9][0-9]* tests?,' /tmp/phpunit.out || { echo "PHPUnit executed no tests or did not report OK"; exit 1; }

  structure:
    name: Plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          set -e
          for f in \
            ai-site-connector.php \
            uninstall.php \
            includes/class-plugin.php \
            includes/class-roles.php \
            includes/class-user-manager.php \
            includes/class-application-passwords.php \
            includes/class-rest-controller.php \
            includes/class-audit-log.php \
            includes/class-admin-page.php \
            includes/class-wp-cli.php \
            includes/class-seo-abstraction.php \
            includes/class-content-inventory.php \
            includes/class-media-audit.php \
            includes/class-link-scanner.php \
            includes/class-export-bundle.php \
            includes/class-content-update.php \
            includes/class-diagnostics.php \
            assets/admin.css \
            assets/admin.js \
            assets/brand/ai-site-connector-mark.svg \
            assets/brand/ai-site-connector-logo.svg \
            assets/brand/ai-site-connector-readme-banner.svg \
            docs/BRAND_ASSETS.md \
            readme.txt \
            README.md \
            LICENSE \
            .gitignore ; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "All required files present."

      # Header, AI_SITE_CONNECTOR_VERSION, readme Stable tag and the MCP
      # example package must agree (previously only header vs readme).
      - name: Version fields agree
        run: |
          set -e
          grep -q "Plugin Name:[[:space:]]*AI Site Connector" ai-site-connector.php
          bin/check-version.sh

      - name: No forbidden files committed
        run: |
          set -e
          forbidden=(
            "node_modules"
            ".env"
            "vendor"
            "*.log"
            "connection-pack.json"
            ".DS_Store"
          )
          fail=0
          for pat in "${forbidden[@]}"; do
            matches=$(git ls-files "$pat" 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "FORBIDDEN: $pat -> $matches"
              fail=1
            fi
          done
          exit $fail

  assets:
    name: JS and SVG assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin libxml2-utils

      - name: Validate SVG markup
        run: xmllint --noout assets/brand/*.svg

      - name: Render SVGs
        run: |
          set -e
          mkdir -p /tmp/asc-svg
          rsvg-convert -w 512 -h 512 assets/brand/ai-site-connector-mark.svg -o /tmp/asc-svg/mark.png
          rsvg-convert -w 980 assets/brand/ai-site-connector-logo.svg -o /tmp/asc-svg/logo.png
          rsvg-convert -w 1200 assets/brand/ai-site-connector-readme-banner.svg -o /tmp/asc-svg/banner.png
          test -s /tmp/asc-svg/mark.png
          test -s /tmp/asc-svg/logo.png
          test -s /tmp/asc-svg/banner.png

      - name: Check admin JavaScript syntax
        run: node --check assets/admin.js

      # The stdio bridge must expose whatever tools the site advertises (#112).
      - name: Stdio MCP bridge contract test
        run: |
          npm install --prefix examples/mcp-server --no-package-lock --no-audit --no-fund
          npm test --prefix examples/mcp-server

  security-grep:
    name: Dangerous-pattern grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbidden functions and credential patterns
        run: tests/security-grep.sh

  package-smoke:
    name: Release ZIP smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync zip unzip

      - name: Build and inspect release ZIP
        run: tests/package-smoke.sh

      # Same commit, same bytes (#101): rebuild after changing every file's
      # time and require an identical archive. The printed sha256 can be
      # compared with a build of the same commit on another machine.
      - name: Reproducible ZIP
        run: |
          set -e
          first="$(bin/build-release-zip.sh | tail -n1)"
          cp "$first" /tmp/asc-first.zip
          find . -path ./.git -prune -o -type f -exec touch {} +
          second="$(bin/build-release-zip.sh | tail -n1)"
          cmp /tmp/asc-first.zip "$second"
          sha256sum "$second"

  zip-install-upgrade:
    # Installs the built ZIP into a fresh site, then upgrades the previous
    # published release ZIP to it — catches packaging and upgrade breakage
    # that the source-tree runtime smoke cannot see.
    name: Release ZIP install + upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, curl, json, zip
          tools: none
          ini-values: memory_limit=512M

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-mysql-client curl jq rsync zip unzip
          curl -L https://github.com/wp-cli/builds/raw/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp
          sudo mv /tmp/wp /usr/local/bin/wp

      - name: Build ZIP, install clean, upgrade from previous release
        env:
          WP_DB_USER: root
          WP_DB_PASSWORD: root
          WP_DB_HOST: 127.0.0.1
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          zip_path="$(bin/build-release-zip.sh | tail -n 1)"
          tests/zip-upgrade-smoke.sh "$zip_path"

  wordpress-runtime:
    name: WordPress runtime smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: asc_runtime_smoke
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, curl, json
          tools: none
          ini-values: memory_limit=512M

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-mysql-client curl jq rsync
          curl -L https://github.com/wp-cli/builds/raw/gh-pages/phar/wp-cli.phar -o /tmp/wp
          php /tmp/wp --info
          chmod +x /tmp/wp
          sudo mv /tmp/wp /usr/local/bin/wp

      - name: Run WordPress runtime smoke test
        env:
          WP_DB_NAME: asc_runtime_smoke
          WP_DB_USER: root
          WP_DB_PASSWORD: root
          WP_DB_HOST: 127.0.0.1
          WP_VERSION: latest
          WP_PORT: 8765
          WP_CLI_MEMORY_LIMIT: 512M
        run: tests/runtime-smoke.sh

  wordpress-version-compat:
    # Surfaces breakage on older / pinned WP versions without blocking releases.
    # Promote to required once individual rows are stable (issue #52).
    name: WP ${{ matrix.wp }} compat
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        wp: ['5.6', '6.5', '6.8', '6.9', '7.0']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: asc_runtime_smoke
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # WP 5.6 is the lowest declared support and requires PHP 8.0 or older
          # for guaranteed bootability; 8.0 covers both rows here.
          php-version: '8.0'
          coverage: none
          extensions: mysqli, curl, json
          tools: none
          ini-values: memory_limit=512M

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-mysql-client curl jq rsync
          curl -L https://github.com/wp-cli/builds/raw/gh-pages/phar/wp-cli.phar -o /tmp/wp
          php /tmp/wp --info
          chmod +x /tmp/wp
          sudo mv /tmp/wp /usr/local/bin/wp

      - name: Run WordPress runtime smoke test (WP ${{ matrix.wp }})
        env:
          WP_DB_NAME: asc_runtime_smoke
          WP_DB_USER: root
          WP_DB_PASSWORD: root
          WP_DB_HOST: 127.0.0.1
          WP_VERSION: ${{ matrix.wp }}
          WP_PORT: 8765
          WP_CLI_MEMORY_LIMIT: 512M
        run: tests/runtime-smoke.sh

  # Network activation must survive the self-updater's reactivation and a
  # rollback (#130). The runtime smoke is single-site, so this installs a
  # two-site network and runs tests/multisite/activation.php.
  multisite-activation:
    name: Multisite activation
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: asc_multisite
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, curl, json
          tools: none
          ini-values: memory_limit=512M

      - name: Install WP-CLI
        run: |
          curl -L https://github.com/wp-cli/builds/raw/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp
          sudo mv /tmp/wp /usr/local/bin/wp

      - name: Network-activate on a two-site network, then check update and rollback scope
        run: |
          set -e
          WP_DIR=/tmp/asc-multisite
          mkdir -p "$WP_DIR"
          wp core download --path="$WP_DIR" --quiet
          wp config create --path="$WP_DIR" --dbname=asc_multisite --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --quiet
          wp core multisite-install --path="$WP_DIR" --url=http://localhost --title="ASC multisite" \
            --admin_user=admin --admin_password=multisite-ci-only --admin_email=admin@example.invalid --skip-email --quiet
          wp site create --path="$WP_DIR" --slug=second --quiet
          rsync -a --exclude='.git/' --exclude='vendor/' --exclude='build/' ./ "$WP_DIR/wp-content/plugins/ai-site-connector/"
          wp plugin activate ai-site-connector --network --path="$WP_DIR"
          wp eval-file "$WP_DIR/wp-content/plugins/ai-site-connector/tests/multisite/activation.php" --path="$WP_DIR" --user=admin
          wp eval-file "$WP_DIR/wp-content/plugins/ai-site-connector/tests/multisite/openapi.php" --path="$WP_DIR" --user=admin
          wp plugin list --path="$WP_DIR" --fields=name,status --format=csv | grep -x 'ai-site-connector,active-network'
