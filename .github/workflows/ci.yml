name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: PHP -l on every PHP file
        run: |
          set -e
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" || status=1
          done < <(find . -name "*.php" \
            -not -path './.git/*' \
            -not -path './vendor/*' \
            -not -path './build/*' \
            -not -path './dist/*' \
            -print0)
          exit $status

  coding-standards:
    name: Composer and PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=512M

      - name: Validate composer metadata
        run: composer validate --strict --no-interaction

      - name: Install dev dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run composer lint
        run: composer lint

      - name: Run WordPress coding standards
        run: composer phpcs

  structure:
    name: Plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          set -e
          for f in \
            ai-site-connector.php \
            includes/class-plugin.php \
            includes/class-roles.php \
            includes/class-user-manager.php \
            includes/class-application-passwords.php \
            includes/class-rest-controller.php \
            includes/class-audit-log.php \
            includes/class-admin-page.php \
            includes/class-wp-cli.php \
            assets/admin.css \
            assets/admin.js \
            assets/brand/ai-site-connector-mark.svg \
            assets/brand/ai-site-connector-logo.svg \
            assets/brand/ai-site-connector-readme-banner.svg \
            docs/BRAND_ASSETS.md \
            readme.txt \
            README.md \
            LICENSE \
            .gitignore ; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "All required files present."

      - name: Plugin header and readme version agree
        run: |
          set -e
          version=$(grep -E '^[[:space:]]*\*[[:space:]]*Version:' ai-site-connector.php | head -1 | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          test -n "$version"
          grep -q "Plugin Name:[[:space:]]*AI Site Connector" ai-site-connector.php
          grep -q "Stable tag: ${version}" readme.txt

      - name: No forbidden files committed
        run: |
          set -e
          forbidden=(
            "node_modules"
            ".env"
            "vendor"
            "*.log"
            "connection-pack.json"
            ".DS_Store"
          )
          fail=0
          for pat in "${forbidden[@]}"; do
            matches=$(git ls-files "$pat" 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "FORBIDDEN: $pat -> $matches"
              fail=1
            fi
          done
          exit $fail

  assets:
    name: JS and SVG assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin libxml2-utils

      - name: Validate SVG markup
        run: xmllint --noout assets/brand/*.svg

      - name: Render SVGs
        run: |
          set -e
          mkdir -p /tmp/asc-svg
          rsvg-convert -w 512 -h 512 assets/brand/ai-site-connector-mark.svg -o /tmp/asc-svg/mark.png
          rsvg-convert -w 980 assets/brand/ai-site-connector-logo.svg -o /tmp/asc-svg/logo.png
          rsvg-convert -w 1200 assets/brand/ai-site-connector-readme-banner.svg -o /tmp/asc-svg/banner.png
          test -s /tmp/asc-svg/mark.png
          test -s /tmp/asc-svg/logo.png
          test -s /tmp/asc-svg/banner.png

      - name: Check admin JavaScript syntax
        run: node --check assets/admin.js

  security-grep:
    name: Dangerous-pattern grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbidden functions and credential patterns
        run: tests/security-grep.sh

  package-smoke:
    name: Release ZIP smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync zip unzip

      - name: Build and inspect release ZIP
        run: tests/package-smoke.sh

  wordpress-runtime:
    name: WordPress runtime smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: asc_runtime_smoke
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, curl, json
          tools: none
          ini-values: memory_limit=512M

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-mysql-client curl jq rsync
          curl -L https://github.com/wp-cli/builds/raw/gh-pages/phar/wp-cli.phar -o /tmp/wp
          php /tmp/wp --info
          chmod +x /tmp/wp
          sudo mv /tmp/wp /usr/local/bin/wp

      - name: Run WordPress runtime smoke test
        env:
          WP_DB_NAME: asc_runtime_smoke
          WP_DB_USER: root
          WP_DB_PASSWORD: root
          WP_DB_HOST: 127.0.0.1
          WP_VERSION: latest
          WP_PORT: 8765
          WP_CLI_MEMORY_LIMIT: 512M
        run: tests/runtime-smoke.sh
