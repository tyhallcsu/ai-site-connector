name: Build release ZIP

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version (e.g. 0.1.0). Defaults to plugin header.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v=$(grep -E '^[[:space:]]*\*[[:space:]]*Version:' ai-site-connector.php \
                | head -1 | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build clean staging dir
        run: |
          set -e
          mkdir -p build/ai-site-connector
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='build/' \
            --exclude='dist/' \
            --exclude='*.zip' \
            --exclude='*.log' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='connection-pack.json' \
            --exclude='*-connection-pack.json' \
            --exclude='*.connection-pack.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpcs.xml' \
            --exclude='phpunit.xml' \
            --exclude='phpunit.xml.dist' \
            --exclude='tests/' \
            --exclude='TESTING_CHECKLIST.md' \
            --exclude='assets/brand/*.png' \
            --exclude='docs/BRAND_ASSETS.md' \
            ./ build/ai-site-connector/

      - name: Verify staging contents
        run: |
          set -e
          ls -la build/ai-site-connector
          test -f build/ai-site-connector/ai-site-connector.php
          test -d build/ai-site-connector/includes
          test -d build/ai-site-connector/assets
          test -f build/ai-site-connector/readme.txt
          test -f build/ai-site-connector/README.md
          test -f build/ai-site-connector/LICENSE
          # No forbidden files in the staging dir
          ! find build/ai-site-connector -name '.git*' -o -name '.DS_Store' -o -name 'node_modules' -o -name '.env*' | grep .

      - name: Create ZIP
        run: |
          cd build
          zip -r "ai-site-connector-v${{ steps.ver.outputs.version }}.zip" ai-site-connector
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-site-connector-v${{ steps.ver.outputs.version }}
          path: build/ai-site-connector-v${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error
