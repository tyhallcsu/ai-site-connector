name: Build release ZIP

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version (e.g. 0.1.0). Defaults to plugin header or tag name.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync zip unzip

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(grep -E '^[[:space:]]*\*[[:space:]]*Version:' ai-site-connector.php \
                | head -1 | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          fi
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG entry exists for resolved version
        run: |
          set -e
          v="${{ steps.ver.outputs.version }}"
          if ! grep -qE "^##[[:space:]]*\[${v//./\\.}\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing an entry for v$v."
            echo 'Add a Keep-a-Changelog section like:'
            echo "  ## [$v] - YYYY-MM-DD"
            exit 1
          fi
          echo "CHANGELOG.md entry for v$v found."

      - name: MCP example version matches plugin version
        run: |
          set -e
          v="${{ steps.ver.outputs.version }}"
          mcp_v=$(node -p "require('./examples/mcp-server/package.json').version")
          if [ "$mcp_v" != "$v" ]; then
            echo "examples/mcp-server/package.json version ($mcp_v) does not match plugin version ($v)."
            echo 'Bump examples/mcp-server/package.json before tagging.'
            exit 1
          fi
          echo "MCP example version matches plugin version ($v)."

      - name: Build release ZIP
        run: bin/build-release-zip.sh "${{ steps.ver.outputs.version }}"

      - name: Verify staging contents
        run: tests/package-smoke.sh "${{ steps.ver.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-site-connector-v${{ steps.ver.outputs.version }}
          path: build/ai-site-connector-v${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ai-site-connector-v${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
