name: Build release ZIP

# Sole release publisher. A pushed v* tag publishes a GitHub Release with the
# plugin ZIP + SHA-256 checksum; workflow_dispatch only builds an artifact.
# Do not also run `gh release create` for the same tag (see docs/RELEASE_CHECKLIST.md).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version (e.g. 0.1.0). Defaults to plugin header.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  checks: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync zip unzip

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(grep -E '^[[:space:]]*\*[[:space:]]*Version:' ai-site-connector.php \
                | head -1 | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          fi
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Header, constant, readme Stable tag + changelog entry, CHANGELOG.md
      # "## [X.Y.Z] - YYYY-MM-DD" heading and the MCP example package.json
      # must all equal the version being released.
      - name: Version fields consistent with release
        run: bin/check-version.sh --release --expect "${{ steps.ver.outputs.version }}"

      - name: Tag points at a commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Tag only merged, tested commits."; exit 1; }

      - name: CI passed for the tagged commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name, (.conclusion // .status)] | @tsv' > checks.tsv
          cat checks.tsv
          fail=0
          for required in "PHPUnit" "Composer and PHPCS" "WordPress runtime smoke" "Release ZIP smoke test" "Release ZIP install + upgrade" "Plugin structure" "Dangerous-pattern grep"; do
            if ! awk -F'\t' -v n="$required" '$1 == n && $2 == "success" { found = 1 } END { exit !found }' checks.tsv; then
              echo "Required check '$required' has not succeeded for $GITHUB_SHA."
              fail=1
            fi
          done
          exit $fail

      - name: Refuse to replace an existing release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite a shipped artifact."
            exit 1
          fi

      - name: Build release ZIP
        run: bin/build-release-zip.sh "${{ steps.ver.outputs.version }}"

      - name: Verify staging contents
        run: tests/package-smoke.sh "${{ steps.ver.outputs.version }}"

      - name: Checksum and release notes
        run: |
          set -e
          v="${{ steps.ver.outputs.version }}"
          cd build
          sha256sum "ai-site-connector-v${v}.zip" > "ai-site-connector-v${v}.zip.sha256"
          cat "ai-site-connector-v${v}.zip.sha256"
          cd ..
          # Body = this version's CHANGELOG.md section.
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > build/release-notes.md
          test -s build/release-notes.md
          {
            echo
            echo "**Install / upgrade:** download \`ai-site-connector-v${v}.zip\` and upload it under Plugins → Add New → Upload, or let the built-in updater pick it up. Verify with the attached \`.sha256\`."
            echo "**Rollback:** reinstall the previous release ZIP from the Releases page; data and settings are preserved."
          } >> build/release-notes.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-site-connector-v${{ steps.ver.outputs.version }}
          path: |
            build/ai-site-connector-v${{ steps.ver.outputs.version }}.zip
            build/ai-site-connector-v${{ steps.ver.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ai-site-connector-v${{ steps.ver.outputs.version }}.zip
            build/ai-site-connector-v${{ steps.ver.outputs.version }}.zip.sha256
          body_path: build/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
