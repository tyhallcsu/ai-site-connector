<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" role="img" aria-labelledby="asc-logo-title asc-logo-desc">
  <title id="asc-logo-title">AI Site Connector logo</title>
  <desc id="asc-logo-desc">Original horizontal logo for AI Site Connector with a protected REST API connection mark and wordmark.</desc>
  <defs>
    <linearGradient id="asc-logo-bg" x1="36" y1="28" x2="212" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="asc-logo-shield" x1="72" y1="52" x2="176" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.58" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="asc-logo-node" x1="84" y1="76" x2="164" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="asc-logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="980" height="240" rx="28" fill="#f8fafc"/>
  <g transform="translate(28 24)">
    <rect width="192" height="192" rx="40" fill="url(#asc-logo-bg)"/>
    <path d="M96 24l53 22v41c0 36-19 65-53 85-34-20-53-49-53-85V46l53-22z" fill="#0b1220" stroke="url(#asc-logo-shield)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M66 77h24M102 77h24M75 118l18-25M117 118l-18-25" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="96" cy="91" r="15" fill="url(#asc-logo-node)" stroke="#22d3ee" stroke-width="4"/>
    <circle cx="62" cy="77" r="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="4"/>
    <circle cx="130" cy="77" r="10" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="4"/>
    <circle cx="75" cy="118" r="10" fill="#ecfeff" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="117" cy="118" r="10" fill="#dcfce7" stroke="#34d399" stroke-width="4"/>
    <path d="M82 91h28M96 77v28" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <path d="M75 145l9 8-9 8M94 161h30" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M159 27l3 9 9 3-9 3-3 9-3-9-9-3 9-3 3-9z" fill="#67e8f9"/>
  </g>
  <g fill="#0f172a" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="260" y="102" font-size="54" font-weight="760" letter-spacing="0">AI Site Connector</text>
    <text x="263" y="143" font-size="22" font-weight="500" fill="#334155">Secure WordPress REST API access with Application Passwords</text>
    <g font-size="15" font-weight="700">
      <rect x="263" y="166" width="92" height="30" rx="15" fill="#e0f2fe"/>
      <text x="281" y="187" fill="#0369a1">REST API</text>
      <rect x="368" y="166" width="154" height="30" rx="15" fill="#dcfce7"/>
      <text x="386" y="187" fill="#047857">Admin-authorized</text>
      <rect x="535" y="166" width="162" height="30" rx="15" fill="#e0f2fe"/>
      <text x="553" y="187" fill="#0f766e">Credential handoff</text>
    </g>
  </g>
</svg>
