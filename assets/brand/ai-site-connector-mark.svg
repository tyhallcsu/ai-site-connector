<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="asc-mark-title asc-mark-desc">
  <title id="asc-mark-title">AI Site Connector mark</title>
  <desc id="asc-mark-desc">Original vector mark showing a protected site shield with connected API nodes and a terminal prompt for authorized AI maintenance.</desc>
  <defs>
    <linearGradient id="asc-mark-bg" x1="36" y1="24" x2="220" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="asc-mark-shield" x1="72" y1="48" x2="184" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.58" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="asc-mark-node" x1="80" y1="72" x2="176" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="asc-mark-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>
