<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="asc-banner-title asc-banner-desc">
  <title id="asc-banner-title">AI Site Connector README banner</title>
  <desc id="asc-banner-desc">Original README banner for AI Site Connector showing secure REST API access for AI coding agents through authorized WordPress Application Passwords.</desc>
  <defs>
    <linearGradient id="asc-banner-bg" x1="88" y1="28" x2="1112" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="asc-banner-card" x1="88" y1="42" x2="1112" y2="318" gradientUnits="userSpaceOnUse">
